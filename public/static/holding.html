<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>网站建设中</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top, rgba(245, 158, 11, 0.22), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.18), transparent 26%),
        linear-gradient(180deg, #0d1016 0%, #08090d 100%);
      color: #f8fafc;
    }
    .card {
      width: min(92vw, 720px);
      padding: 40px 32px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      background: rgba(15, 18, 26, 0.88);
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      backdrop-filter: blur(18px);
      text-align: center;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(253, 224, 71, 0.82);
    }
    h1 {
      margin: 18px 0 14px;
      font-size: clamp(32px, 6vw, 54px);
      line-height: 1.06;
    }
    p {
      margin: 0 auto;
      max-width: 540px;
      font-size: 16px;
      line-height: 1.9;
      color: rgba(255,255,255,0.72);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Construction</div>
    <h1>网站建设中</h1>
    <p>当前页面仅用于备案与临时展示，正式内容将在备案完成后开放访问。</p>
  </main>
</body>
</html>
